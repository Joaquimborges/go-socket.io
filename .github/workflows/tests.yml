name: Tests

# The test stage. It runs on its own for every push to master, and is called by the pipeline as its first step,
# so a pull request is tested the same way before any tag is pushed.
on:
  workflow_call:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tests:
    name: ubuntu Go
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go version
        run: go version

      - name: Go Format
        run: test -z "$(gofmt -s -l .)"

      - name: Go Tidy
        run: go mod tidy && git diff --exit-code

      - name: Go Mod Verify
        run: go mod verify

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

      - name: Run tests
        run: make test
